[project]
name = "hirevion"
version = "0.0.0"
description = "Hirevion monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = ["hirevion-devcli", "hirevion-interview-agent"]

[tool.uv]
package = false
# The uv cache (C:) and the repo (D:) are on different drives, so hardlinks can't be used.
link-mode = "copy"

[tool.uv.workspace]
members = ["tools/devcli", "backend/interview_agent"]

[tool.uv.sources]
hirevion-devcli = { workspace = true }
hirevion-interview-agent = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hirevion_devcli", "hirevion_interview_agent"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = ["tools/devcli/tests", "backend/interview_agent/tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
