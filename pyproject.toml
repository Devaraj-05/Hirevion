[project]
name = "hirevion"
version = "0.0.0"
description = "Hirevion monorepo workspace root"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hirevion-api",
  "hirevion-core",
  "hirevion-devcli",
  "hirevion-interview-agent",
  "hirevion-interview-simulator",
  "hirevion-voice-bench",
]

[tool.uv]
package = false
# The uv cache (C:) and the repo (D:) are on different drives, so hardlinks can't be used.
link-mode = "copy"

[tool.uv.workspace]
members = [
  "tools/devcli",
  "backend/core",
  "backend/api",
  "backend/interview_agent",
  "tools/interview-simulator",
  "tools/voice_bench",
]

[tool.uv.sources]
hirevion-api = { workspace = true }
hirevion-core = { workspace = true }
hirevion-devcli = { workspace = true }
hirevion-interview-agent = { workspace = true }
hirevion-interview-simulator = { workspace = true }
hirevion-voice-bench = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "types-openpyxl>=3.1",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "hirevion_api",
  "hirevion_core",
  "hirevion_devcli",
  "hirevion_interview_agent",
  "hirevion_interview_simulator",
  "hirevion_voice_bench",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]

[tool.pytest.ini_options]
testpaths = [
  "tools/devcli/tests",
  "backend/core/tests",
  "backend/api/tests",
  "backend/interview_agent/tests",
  "tools/interview-simulator/tests",
  "tools/voice_bench/tests",
]
# importlib: test modules in different packages may share a name (e.g. test_settings.py).
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: needs the local stack from `uv run hv up` (PostgreSQL, Valkey, Azurite) or CI's containers",
  "live: calls the real AI vendors with the keys in .env; skipped unless pytest gets --live",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# pypdfium2 and reportlab ship no type information.
module = ["pypdfium2", "pypdfium2.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
