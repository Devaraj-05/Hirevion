name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Git hook self-tests
        run: sh tools/hooks/test-hooks.sh

  python:
    runs-on: ubuntu-24.04
    # The `db` tests run against real PostgreSQL and Valkey (the same images as the local stack).
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: hirevion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirevion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirevion -d hirevion_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: hirevion
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirevion_test
      VALKEY_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate throwaway passwords for the application database roles
        run: |
          echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "POSTGRES_RELAY_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy tools/devcli/src backend/core/src backend/interview_agent/src
          tools/voice_bench/src
      - run: uv run pytest

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate a throwaway .env
        run: uv run hv init-env
      - name: Validate the local stack definition
        run: >-
          docker compose --env-file .env -f infrastructure/local/compose.yaml
          --profile core --profile edge --profile media --profile obs config --quiet

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the desktop webview (Tauri embeds dist/ at compile time)
        run: pnpm --filter @hirevion/ai-interviewer-desktop build
      - name: Install the pinned Rust toolchain
        working-directory: ai-interviewer-desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-interviewer-desktop/src-tauri
      - name: Rust format
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo fmt --all --check
      - name: Rust lint
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo test --workspace --locked

  rust-licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ai-interviewer-desktop/src-tauri/Cargo.toml
          command: check advisories bans licenses sources
