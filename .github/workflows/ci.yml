name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repo a push touched, so each job runs only when its area changed. On main
  # and on manual runs every job runs. Feature branches compare against main, so a later push
  # never skips a job the branch as a whole needs.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}
      contract: ${{ steps.filter.outputs.contract }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      compose: ${{ steps.filter.outputs.compose }}
      desktop: ${{ steps.filter.outputs.desktop }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/**"
            python:
              - *ci
              - "backend/**"
              - "tools/**"
              - "pyproject.toml"
              - "uv.lock"
            contract:
              - *ci
              - "backend/**"
              - "packages/api-client/**"
              - "tools/api-codegen/**"
              - "uv.lock"
            web:
              - *ci
              - "recruitment-platform/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
            e2e:
              - *ci
              - "backend/**"
              - "recruitment-platform/**"
              - "packages/**"
              - "tools/devcli/**"
              - "uv.lock"
              - "pnpm-lock.yaml"
            compose:
              - *ci
              - "infrastructure/**"
              - "backend/**"
              - "uv.lock"
            desktop:
              - *ci
              - "ai-interviewer-desktop/**"
              - "packages/**"
              - "pnpm-lock.yaml"
            rust:
              - *ci
              - "ai-interviewer-desktop/src-tauri/**"

  hooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Git hook self-tests
        run: sh tools/hooks/test-hooks.sh

  python:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    # The `db` tests run against real PostgreSQL and Valkey (the same images as the local stack).
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: hirevion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirevion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirevion -d hirevion_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # The mail tests send real SMTP and read it back through Mailpit's API.
      mailpit:
        image: axllent/mailpit:latest@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: hirevion
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirevion_test
      VALKEY_HOST: 127.0.0.1
      HV_HIBP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate throwaway passwords for the application database roles
        run: |
          echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "POSTGRES_RELAY_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start Azurite (the local stack's blob storage) with a throwaway account key
        run: |
          key=$(openssl rand -base64 64 | tr -d '\n')
          echo "::add-mask::$key"
          docker run -d --name azurite -p 127.0.0.1:10000:10000 \
            -e AZURITE_ACCOUNTS="hirevion:$key" \
            mcr.microsoft.com/azure-storage/azurite:latest@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose --disableProductStyleUrl
          echo "AZURE_STORAGE_ACCOUNT=hirevion" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_KEY=$key" >> "$GITHUB_ENV"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: >-
          uv run mypy tools/devcli/src backend/core/src backend/api/src
          backend/interview_agent/src tools/voice_bench/src
      - run: uv run pytest

  # The committed OpenAPI document and the TypeScript types generated from it match the API.
  api-contract:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --locked
      - name: The OpenAPI document is current
        run: uv run hv openapi --check
      - run: pnpm install --frozen-lockfile
      - name: The generated TypeScript types are current
        run: |
          pnpm --filter @hirevion/api-codegen generate
          git diff --exit-code packages/api-client/src/schema.d.ts

  web:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @hirevion/recruitment-platform exec playwright install --with-deps chromium
      - name: End to end (every route and role, axe in both themes, keyboard, CSP, hosts)
        run: pnpm --filter @hirevion/recruitment-platform e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: recruitment-platform/playwright-report/
          retention-days: 7

  # Sign-in end to end: the web app (behind a gateway like Caddy) against the real API,
  # PostgreSQL, Valkey and Mailpit (SP-02a).
  e2e-auth:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: hirevion
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirevion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hirevion -d hirevion"
          --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8@sha256:640c5e62cea04b6d6f2084232651d0cc70362d31f4f805e7be94dbed6855e8f2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: hirevion
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hirevion
      VALKEY_HOST: 127.0.0.1
      HV_ENVIRONMENT: ci
      HV_HIBP_ENABLED: "false"
      HV_WEB_ORIGIN: http://app.hirevion.localhost:3100
      OTEL_SDK_DISABLED: "true"
      # Job descriptions are read with the mock AI and its scripted answer; there's no ClamAV
      # here, and pasted descriptions have no file to scan anyway.
      HV_AI_PROFILE: mock
      HV_AI_MOCK_SCRIPTS: recruitment-platform/e2e/auth/ai-scripts.json
      HV_DOCUMENTS_SCAN: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Throwaway secrets (the hv commands read settings from the environment)
        run: |
          echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "POSTGRES_RELAY_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "HV_SEED_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_ACCOUNT=hirevion" >> "$GITHUB_ENV"
          echo "AZURE_STORAGE_KEY=$(openssl rand -base64 64 | tr -d '\n')" >> "$GITHUB_ENV"
          touch .env
      - name: Blob storage for uploads (Azurite, with the throwaway account)
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 \
            -e AZURITE_ACCOUNTS="${AZURE_STORAGE_ACCOUNT}:${AZURE_STORAGE_KEY}" \
            mcr.microsoft.com/azure-storage/azurite:latest@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for _ in $(seq 1 30); do
            uv run hv storage-init && exit 0
            sleep 2
          done
          docker logs azurite
          exit 1
      - run: uv run hv migrate
      - run: uv run hv seed-identity
      - name: Start the API (it also runs the outbox relay and the mail consumer)
        run: |
          nohup uv run hv api --no-reload > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ready && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - name: Install Chromium for Playwright
        run: pnpm --filter @hirevion/recruitment-platform exec playwright install --with-deps chromium
      - name: Sign-in, accounts, organisations, jobs, job descriptions and resumes
        run: pnpm --filter @hirevion/recruitment-platform e2e
        env:
          HV_E2E_API: "1"
      # `uv run` holds uv's cache lock while the API runs, and setup-uv's post step prunes that
      # cache: left running, the API made the prune time out and fail the job.
      - name: Stop the API
        if: always()
        run: |
          pkill -TERM -f "hv api" || true
          for _ in $(seq 1 20); do
            pgrep -f "hv api" > /dev/null || exit 0
            sleep 1
          done
          pkill -KILL -f "hv api" || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-auth-report
          path: |
            recruitment-platform/playwright-report/
            api.log
          retention-days: 7

  compose:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Generate a throwaway .env
        run: uv run hv init-env
      - name: Validate the local stack definition
        run: >-
          docker compose --env-file .env -f infrastructure/local/compose.yaml
          --profile core --profile edge --profile media --profile obs config --quiet
      - name: Build the API image
        run: docker build -f backend/api/Dockerfile -t hirevion-api:ci .
      - name: The API image starts and answers its liveness probe
        run: |
          docker run -d --name hirevion-api -p 127.0.0.1:8000:8000 \
            -e OTEL_SDK_DISABLED=true -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_APP_PASSWORD=ci -e POSTGRES_RELAY_PASSWORD=ci hirevion-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live; then exit 0; fi
            sleep 1
          done
          docker logs hirevion-api
          exit 1

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Biome, type checks and unit tests across every TypeScript package. Cheap, so it always runs.
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  desktop:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the desktop webview (Tauri embeds dist/ at compile time)
        run: pnpm --filter @hirevion/ai-interviewer-desktop build
      - name: Install the pinned Rust toolchain
        working-directory: ai-interviewer-desktop/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-interviewer-desktop/src-tauri
      - name: Rust format
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo fmt --all --check
      - name: Rust lint
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        working-directory: ai-interviewer-desktop/src-tauri
        run: cargo test --workspace --locked

  rust-licenses:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ai-interviewer-desktop/src-tauri/Cargo.toml
          command: check advisories bans licenses sources
