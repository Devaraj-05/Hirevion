# cargo-deny policy for the desktop app (run in CI by the rust-licenses job).
# Licenses follow MASTER_IMPLEMENTATION_PLAN.md §13: permissive licenses and unmodified MPL-2.0 only.

[graph]
# The app ships for Windows only; ignore Linux/macOS-only dependencies.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # crypto-bigint 0.5 (via p256 0.13 in hv-security): timing variability in operations meant to
  # be constant-time. DPoP proofs are signed by the Windows key store (NCrypt); p256 verifies
  # public signatures and signs only in SoftwareKey, the fallback when no key store works.
  # Accepted until 2027-02-28 (osv-scanner.toml); upgrade hv-security to p256 0.14 before then
  # (docs/STATUS.md).
  { id = "RUSTSEC-2026-0387", reason = "p256 signs only in the no-key-store fallback; p256 0.14 upgrade tracked in docs/STATUS.md" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is the project policy, not just what today's dependencies use.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# Our own crates are unpublished (publish = false) and carry no public license.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
