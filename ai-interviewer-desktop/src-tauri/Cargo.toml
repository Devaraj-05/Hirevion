[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  # SP-08a: device keys and the DPAPI vault, debugger checks, privacy settings, disk space.
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_Registry",
  # SP-11 (native monitoring) is prepared here so lanes don't race on this list.
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[package]
name = "hirevion-desktop"
description = "Hirevion AI Interview desktop app for candidates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hirevion_desktop_lib"

[[bin]]
name = "hirevion-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-single-instance = "2"
url = "2"
# SP-08b: the watchers, the proctoring queue and the recording pipeline run inside the app.
tokio = { version = "1.47.1", features = ["macros", "rt", "sync", "time"] }
hv-api-client = { path = "crates/api-client" }
hv-event-queue = { path = "crates/event-queue" }
hv-monitor = { path = "crates/monitor" }
hv-security = { path = "crates/security" }
hv-segment-store = { path = "crates/segment-store" }
hv-system-check = { path = "crates/system-check" }
hv-uploader = { path = "crates/uploader" }
# SP-08c: the signed updater (Tauri's own, minisign-verified) and crash reporting to GlitchTip.
# The updater is driven from Rust commands only, so the webview gets no updater permissions.
tauri-plugin-updater = "2.13.3"
semver = "1.0.28"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Panics and webview errors go to GlitchTip (Sentry-compatible) when HV_GLITCHTIP_DSN was set at
# build time. No default features: no debug-images, logs, metrics or release-health. The ring
# provider is installed by hand (rustls-no-provider), as the API client does, so no aws-lc.
sentry = { version = "0.49.3", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "reqwest",
  "rustls-no-provider",
] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
base64 = "0.22.1"
tauri = { version = "2.12.0", features = ["test"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[target.'cfg(windows)'.dependencies]
# The screen recorder is Media Foundation, so it exists on Windows only.
hv-recorder = { path = "crates/recorder" }
webview2-com = "0.39.1"
windows = { workspace = true }
windows-core = { workspace = true }
