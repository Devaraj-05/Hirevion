[workspace]
members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  # SP-08a: device keys and the DPAPI vault, debugger checks, privacy settings, disk space.
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Memory",
  "Win32_System_Registry",
  # SP-11 (native monitoring) is prepared here so lanes don't race on this list.
  "Win32_System_RemoteDesktop",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"

[package]
name = "hirevion-desktop"
description = "Hirevion AI Interview desktop app for candidates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hirevion_desktop_lib"

[[bin]]
name = "hirevion-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-single-instance = "2"
url = "2"
hv-api-client = { path = "crates/api-client" }
hv-security = { path = "crates/security" }
hv-system-check = { path = "crates/system-check" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { workspace = true }
windows-core = { workspace = true }
