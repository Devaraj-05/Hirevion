[package]
name = "hv-uploader"
description = "Uploads recorded segments: upload URL, throttled PUT to blob storage, hash-verified acknowledgement and crash recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.10.1"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hv-api-client = { path = "../api-client" }
hv-segment-store = { path = "../segment-store" }
rand_core = { version = "0.6.4", features = ["getrandom"] }
# The PUT goes straight to blob storage: plain reqwest, rustls with ring and the OS verifier
# (as in hv-api-client), and `stream` so the body can be throttled chunk by chunk.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["sync", "time"] }
url = "2.5.7"

[dev-dependencies]
hv-security = { path = "../security" }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.18.1", features = ["v4"] }
wiremock = "0.6.5"
