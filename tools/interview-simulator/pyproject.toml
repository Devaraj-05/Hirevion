[project]
name = "hirevion-interview-simulator"
version = "0.1.0"
description = "A synthetic candidate for Hirevion's interviews: a DPoP desktop client and six personas."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43",
  "hirevion-core",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirevion_interview_simulator"]

[tool.uv.sources]
hirevion-core = { workspace = true }
