[project]
name = "hirevion-voice-bench"
version = "0.1.0"
description = "Synthetic-candidate benchmark for Hirevion's voice-interview latency."
requires-python = ">=3.12,<3.13"
dependencies = [
  "hirevion-interview-agent",
  "hirevion-interview-simulator",
  "httpx>=0.27",
  "livekit>=1.0",
  "livekit-api>=1.0",
  "numpy>=1.26",
]

[project.scripts]
hv-voice-bench = "hirevion_voice_bench.bench:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirevion_voice_bench"]

[tool.uv.sources]
hirevion-interview-agent = { workspace = true }
hirevion-interview-simulator = { workspace = true }
