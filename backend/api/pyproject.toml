[project]
name = "hirevion-api"
version = "0.1.0"
description = "Hirevion REST API: recruitment, candidate and proctoring routes under /api/v1."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141",
  "hirevion-core",
  "opentelemetry-api>=1.44",
  "opentelemetry-instrumentation-fastapi>=0.65b0",
  "uvicorn>=0.54",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirevion_api"]
