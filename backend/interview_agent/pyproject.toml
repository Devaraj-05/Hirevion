[project]
name = "hirevion-interview-agent"
version = "0.1.0"
description = "LiveKit Agents worker that runs Hirevion's AI interviewer."
requires-python = ">=3.12,<3.13"
dependencies = [
  "hirevion-core",
  "livekit-agents[deepgram,openai,silero,turn-detector]>=1.2",
  "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirevion_interview_agent"]

[tool.uv.sources]
hirevion-core = { workspace = true }
