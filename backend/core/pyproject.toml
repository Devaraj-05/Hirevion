[project]
name = "hirevion-core"
version = "0.1.0"
description = "Shared Hirevion backend core: settings, database and tenancy, audit, outbox."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "aiosmtplib>=4.0",
    "alembic>=1.14",
    "argon2-cffi>=25.1",
    "asyncpg>=0.30",
    "azure-storage-blob>=12.30",
    "jinja2>=3.1",
    "openai>=2.54",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2025.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hirevion_core"]
