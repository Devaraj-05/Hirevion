# Alembic configuration for the Hirevion database. Apply migrations with `uv run hv migrate`,
# which also creates the database roles the migrations grant to. To add a migration:
#   uv run alembic -c backend/migrations/alembic.ini revision -m "add jobs"
# Migrations are written by hand: RLS policies, grants and partitions don't autogenerate.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
path_separator = os
